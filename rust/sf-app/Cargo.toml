[package]
name = "sf-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "starfox-hd-rs"
path = "src/main.rs"

[dependencies]
sf-core.workspace = true
sf-path.workspace = true
sf-map.workspace = true
sf-strat.workspace = true
sf-game.workspace = true
sf-render.workspace = true
sf-audio.workspace = true
# SDL3 owns the window + input + audio; wgpu renders into its surface via
# raw-window-handle. use-pkg-config discovers SDL3 from the nix devshell.
sdl3 = { version = "0.18", features = ["use-pkg-config", "raw-window-handle"] }
wgpu = "26"
raw-window-handle = "0.6"
