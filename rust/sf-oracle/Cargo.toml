[package]
name = "sf-oracle"
version.workspace = true
edition.workspace = true
license.workspace = true

# ROM-oracle differential harness: runs real SF1 65816 subroutines from the
# retail ROM and diffs them against the Rust port's functions.
[dependencies]
w65c816 = "0.1"
sf-spc.workspace = true

[dev-dependencies]
sf-core.workspace = true
sf-strat.workspace = true
sf-game.workspace = true
sf-map.workspace = true
sf-path.workspace = true
sf2-game = { workspace = true, features = ["oracle-bridge"] }
sf2-data = { workspace = true, features = ["oracle-data"] }
sf2-path.workspace = true
sf-difftest.workspace = true
