[package]
name = "sf-oracle"
version.workspace = true
edition.workspace = true
license.workspace = true

# ROM-oracle differential harness: runs real SF1 65816 subroutines from the
# retail ROM and diffs them against the Rust port's functions.
[dependencies]
w65c816 = "0.1"
sf-spc.workspace = true

[dev-dependencies]
sf-core.workspace = true
sf-strat.workspace = true
sf-game.workspace = true
sf-map.workspace = true
sf-path.workspace = true
sf-render.workspace = true
sf-audio.workspace = true
sf2-game = { workspace = true, features = ["oracle-bridge"] }
sf2-data = { workspace = true, features = ["oracle-data"] }
sf2-path.workspace = true
sf-difftest.workspace = true
sha2 = "0.10"

[[example]]
name = "sf1_weapon_trace"
path = "examples/sf1_weapon_trace.rs"
test = true
harness = false

[[example]]
name = "sf1_training_trace"
path = "examples/sf1_training_trace.rs"
test = true
harness = false

[[example]]
name = "sf1_title_trace"
path = "examples/sf1_title_trace.rs"
test = true
harness = false
